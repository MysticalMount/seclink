name: Go Test Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: seclink/go.mod

      - name: Install dependencies
        run: go mod download
        working-directory: seclink

      - name: Run tests
        run: go test ./...
        working-directory: seclink
